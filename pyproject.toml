[project]
name = "openmontage"
version = "0.1.0"
description = "Open-source agentic video production system"
requires-python = ">=3.10"
dependencies = [
  "pyyaml>=6.0",
  "pydantic>=2.0",
  "jsonschema>=4.20",
  "python-dotenv>=1.0",
  "Pillow>=10.0",
  "numpy>=1.24",
  "requests>=2.31",
  "google-auth>=2.0",
  "google-genai>=1.0.0",
  "openai>=2.44.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "watchfiles>=0.21"
]

[tool.vercel]
entrypoint = "backlot.server:app"
